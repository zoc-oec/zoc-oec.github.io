      <stop offset="0.55" stop-color="#0091c4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="csoft" x="-60%" y="-60%" width="220%" height="220%">
