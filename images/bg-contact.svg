      <line x1="870" y1="220" x2="1090" y2="220"/>
      <line x1="1090" y1="220" x2="1160" y2="120"/>
      <line x1="1090" y1="220" x2="1170" y2="330"/>
      <line x1="1160" y1="120" x2="1250" y2="210"/>
      <line x1="1250" y1="210" x2="1320" y2="110"/>
      <line x1="1250" y1="210" x2="1360" y2="300"/>
      <line x1="1320" y1="110" x2="1390" y2="180"/>
      <line x1="1000" y1="150" x2="960" y2="60"/>
      <line x1="1160" y1="120" x2="1180" y2="60"/>
