      <line x1="500" y1="300" x2="430" y2="140"/>
      <line x1="930" y1="330" x2="1170" y2="330"/>
    </g>
  </g>
  <!-- nodes -->
  <g fill="#45eaff">
    <circle cx="700" cy="310" r="2.6" fill-opacity="0.55"/>
    <circle cx="800" cy="110" r="3" fill-opacity="0.75"/>
    <circle cx="930" cy="330" r="2.6" fill-opacity="0.6"/>
    <circle cx="1000" cy="150" r="3" fill-opacity="0.8"/>
    <circle cx="1080" cy="252" r="2.6" fill-opacity="0.65"/>
    <circle cx="1160" cy="120" r="2.8" fill-opacity="0.7"/>
    <circle cx="1170" cy="330" r="2.4" fill-opacity="0.5"/>
    <circle cx="1250" cy="210" r="3" fill-opacity="0.75"/>
    <circle cx="1320" cy="110" r="2.6" fill-opacity="0.62"/>
