<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1c34"/>
      <stop offset="0.55" stop-color="#0b1f38"/>
      <stop offset="1" stop-color="#07162b"/>
    </linearGradient>
    <radialGradient id="nglow" cx="76%" cy="40%" r="58%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#0091c4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="420" fill="url(#nbg)"/>
  <rect width="1440" height="420" fill="url(#nglow)"/>

  <!-- overlapping photo frames (gallery motif) -->
  <g fill="none" stroke="#00d4ff">
    <g transform="rotate(-8 1010 195)" stroke-opacity="0.20">
      <rect x="900" y="120" width="220" height="160" rx="10" fill="#00d4ff" fill-opacity="0.03" stroke-width="1.6"/>
      <circle cx="950" cy="165" r="13" stroke-opacity="0.32" stroke-width="1.4"/>
      <polyline points="918,258 985,205 1030,236 1075,196 1102,258" stroke-opacity="0.28" stroke-width="1.4"/>
    </g>
    <g transform="rotate(7 1230 175)" stroke-opacity="0.26">
      <rect x="1120" y="92" width="220" height="160" rx="10" fill="#00d4ff" fill-opacity="0.04" stroke-width="1.7"/>
      <circle cx="1172" cy="138" r="13" stroke-opacity="0.4" stroke-width="1.5"/>
      <polyline points="1138,230 1205,176 1250,208 1296,168 1322,230" stroke-opacity="0.34" stroke-width="1.5"/>
    </g>
    <g transform="rotate(-3 1140 305)" stroke-opacity="0.14">
      <rect x="1045" y="232" width="200" height="146" rx="9" fill="#00d4ff" fill-opacity="0.025" stroke-width="1.5"/>
    </g>
  </g>

  <!-- scattered dots -->
  <g fill="#45eaff">
    <circle cx="150" cy="120" r="2.4" fill-opacity="0.30"/>
    <circle cx="300" cy="300" r="2" fill-opacity="0.22"/>
    <circle cx="470" cy="180" r="2.2" fill-opacity="0.26"/>
    <circle cx="620" cy="330" r="1.8" fill-opacity="0.18"/>
    <circle cx="760" cy="150" r="2" fill-opacity="0.2"/>
    <circle cx="860" cy="350" r="2.2" fill-opacity="0.22"/>
    <circle cx="980" cy="60" r="2" fill-opacity="0.24"/>
    <circle cx="1330" cy="330" r="2.4" fill-opacity="0.3"/>
    <circle cx="1390" cy="120" r="2" fill-opacity="0.22"/>
  </g>
  <!-- glowing accent nodes -->
  <g fill="#bdf3ff">
    <circle cx="1172" cy="138" r="2.6"/>
    <circle cx="950" cy="165" r="2.2" fill-opacity="0.8"/>
  </g>
</svg>
