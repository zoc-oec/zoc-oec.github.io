<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.55" stop-color="#0a1d33"/>
      <stop offset="1" stop-color="#0c2740"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="400" fill="url(#g)"/>
  <rect width="1440" height="400" fill="url(#glow)"/>
  <!-- faint year gridlines -->
  <g stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="800" y1="40" x2="800" y2="360"/>
    <line x1="920" y1="40" x2="920" y2="360"/>
    <line x1="1040" y1="40" x2="1040" y2="360"/>
    <line x1="1160" y1="40" x2="1160" y2="360"/>
    <line x1="1280" y1="40" x2="1280" y2="360"/>
    <line x1="1400" y1="40" x2="1400" y2="360"/>
  </g>
  <!-- three longitudinal cohort tracks, gently rising over time -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="760,150 880,140 1000,124 1120,118 1240,104 1380,96" stroke="#00d4ff" stroke-opacity="0.42"/>
    <polyline points="760,232 880,224 1000,214 1120,206 1240,196 1380,184" stroke="#45eaff" stroke-opacity="0.32"/>
    <polyline points="760,312 880,300 1000,294 1120,282 1240,274 1380,262" stroke="#7fd8ff" stroke-opacity="0.26"/>
  </g>
  <!-- cohort follow-up nodes -->
  <g fill="#00d4ff">
    <g fill-opacity="0.55">
      <circle cx="760" cy="150" r="4"/><circle cx="1000" cy="124" r="4"/><circle cx="1240" cy="104" r="4"/><circle cx="1380" cy="96" r="4.5"/>
    </g>
    <g fill-opacity="0.4">
      <circle cx="760" cy="232" r="4"/><circle cx="1000" cy="214" r="4"/><circle cx="1240" cy="196" r="4"/><circle cx="1380" cy="184" r="4.5"/>
    </g>
    <g fill-opacity="0.32">
      <circle cx="760" cy="312" r="4"/><circle cx="1000" cy="294" r="4"/><circle cx="1240" cy="274" r="4"/><circle cx="1380" cy="262" r="4.5"/>
    </g>
  </g>
</svg>
