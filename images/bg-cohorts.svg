<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.55" stop-color="#0a1d33"/>
      <stop offset="1" stop-color="#0c2740"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="400" fill="url(#g)"/>
  <rect width="1440" height="400" fill="url(#glow)"/>
  <g>
  <!-- faint year gridlines -->
  <g stroke="#00d4ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="360" y1="40" x2="360" y2="360"/>
    <line x1="480" y1="40" x2="480" y2="360"/>
    <line x1="600" y1="40" x2="600" y2="360"/>
    <line x1="720" y1="40" x2="720" y2="360"/>
    <line x1="840" y1="40" x2="840" y2="360"/>
    <line x1="960" y1="40" x2="960" y2="360"/>
    <line x1="1080" y1="40" x2="1080" y2="360"/>
  </g>
  <!-- three longitudinal cohort tracks, gently rising over time -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="320,150 440,140 560,124 680,118 800,104 940,96" stroke="#00d4ff" stroke-opacity="0.42"/>
    <polyline points="320,232 440,224 560,214 680,206 800,196 940,184" stroke="#45eaff" stroke-opacity="0.32"/>
    <polyline points="320,312 440,300 560,294 680,282 800,274 940,262" stroke="#7fd8ff" stroke-opacity="0.26"/>
  </g>
  <!-- cohort follow-up nodes -->
  <g fill="#00d4ff">
    <g fill-opacity="0.55">
      <circle cx="320" cy="150" r="4"/><circle cx="560" cy="124" r="4"/><circle cx="800" cy="104" r="4"/><circle cx="940" cy="96" r="4.5"/>
    </g>
    <g fill-opacity="0.4">
      <circle cx="320" cy="232" r="4"/><circle cx="560" cy="214" r="4"/><circle cx="800" cy="196" r="4"/><circle cx="940" cy="184" r="4.5"/>
    </g>
    <g fill-opacity="0.32">
      <circle cx="320" cy="312" r="4"/><circle cx="560" cy="294" r="4"/><circle cx="800" cy="274" r="4"/><circle cx="940" cy="262" r="4.5"/>
    </g>
  </g>
  </g>
</svg>
