<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.55" stop-color="#0a1d33"/>
      <stop offset="1" stop-color="#0c2740"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="400" fill="url(#g)"/>
  <rect width="1440" height="400" fill="url(#glow)"/>
  <!-- baseline -->
  <line x1="770" y1="330" x2="1400" y2="330" stroke="#00d4ff" stroke-opacity="0.12" stroke-width="1"/>
  <!-- ascending output bars (publications growing over years) -->
  <g fill="#00d4ff">
    <rect x="780"  y="280" width="46" height="50"  rx="5" fill-opacity="0.18"/>
    <rect x="868"  y="252" width="46" height="78"  rx="5" fill-opacity="0.22"/>
    <rect x="956"  y="224" width="46" height="106" rx="5" fill-opacity="0.26"/>
    <rect x="1044" y="186" width="46" height="144" rx="5" fill-opacity="0.30"/>
    <rect x="1132" y="150" width="46" height="180" rx="5" fill-opacity="0.34"/>
    <rect x="1220" y="116" width="46" height="214" rx="5" fill-opacity="0.40"/>
    <rect x="1308" y="86"  width="46" height="244" rx="5" fill-opacity="0.46"/>
  </g>
  <!-- impact trend line over the bars -->
  <polyline points="803,272 891,238 979,206 1067,168 1155,132 1243,100 1331,72"
            fill="none" stroke="#45eaff" stroke-opacity="0.5" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#45eaff" fill-opacity="0.7">
    <circle cx="803" cy="272" r="4"/><circle cx="979" cy="206" r="4"/>
    <circle cx="1155" cy="132" r="4"/><circle cx="1331" cy="72" r="4.5"/>
  </g>
</svg>
