<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#eaeef4"/>
    </linearGradient>
    <radialGradient id="lglow" cx="80%" cy="34%" r="60%">
      <stop offset="0" stop-color="#9bbfe6" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#9bbfe6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#9bbfe6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lwarm" cx="92%" cy="64%" r="42%">
      <stop offset="0" stop-color="#c19a3e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c19a3e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="420" fill="url(#lbg)"/>
  <rect width="1440" height="420" fill="url(#lglow)"/>
  <rect width="1440" height="420" fill="url(#lwarm)"/>

  <!-- flowing lines (echo of the home-page background) -->
  <g fill="none" stroke="#7fa8d6">
    <path d="M-40 330 C 260 250, 520 380, 820 300 S 1300 250, 1500 320" stroke-opacity="0.22" stroke-width="1.6"/>
    <path d="M-40 360 C 280 300, 560 410, 880 330 S 1320 300, 1500 360" stroke-opacity="0.16" stroke-width="1.4"/>
    <path d="M-40 300 C 240 210, 540 340, 860 250 S 1320 200, 1500 270" stroke-opacity="0.12" stroke-width="1.2"/>
  </g>
  <!-- faint concentric arc motif (eye/lens hint) on the right -->
  <g fill="none" stroke="#9e1c30" stroke-opacity="0.10">
    <circle cx="1230" cy="150" r="120" stroke-width="1.3"/>
    <circle cx="1230" cy="150" r="78" stroke-width="1.2"/>
    <circle cx="1230" cy="150" r="36" stroke-width="1.1"/>
  </g>

  <!-- scattered dots -->
  <g fill="#6f9ccb">
    <circle cx="160" cy="150" r="2.2" fill-opacity="0.34"/>
    <circle cx="330" cy="300" r="2" fill-opacity="0.26"/>
    <circle cx="520" cy="200" r="2.2" fill-opacity="0.30"/>
    <circle cx="700" cy="330" r="1.8" fill-opacity="0.22"/>
    <circle cx="900" cy="180" r="2" fill-opacity="0.24"/>
    <circle cx="1050" cy="340" r="2.2" fill-opacity="0.24"/>
    <circle cx="1300" cy="300" r="2.4" fill-opacity="0.3"/>
    <circle cx="1380" cy="120" r="2" fill-opacity="0.24"/>
  </g>
  <g fill="#c19a3e">
    <circle cx="1230" cy="150" r="3" fill-opacity="0.55"/>
  </g>
</svg>
