<style>
/* 1. 极致深空背景 */
.masthead {
  background-color: #050b14 !important;
  border-bottom: none !important;
}

/* 2. 保持透明与基础白字 */
.masthead__inner-wrap,
.masthead__menu,
.greedy-nav,
.greedy-nav *,
.site-nav,
.site-navigation,
.main-navigation,
.navbar {
  background-color: transparent !important;
  background: transparent !important;
  color: #ffffff !important;
  text-decoration: none !important;
}

/* 3. 菜单项常规排版 */
.greedy-nav a,
.site-nav a,
.main-navigation a,
.navbar a {
  padding-bottom: 6px !important;
  border-bottom: 2px solid transparent !important;
  transition: all 0.3s ease !important;
}

/* 4. 鼠标悬停时的效果 */
.greedy-nav a:hover,
.site-nav a:hover,
.main-navigation a:hover,
.navbar a:hover {
  color: #00bfa5 !important;
  border-bottom: 2px solid #00bfa5 !important;
}

/* 5. 手机端保护机制 */
.greedy-nav__toggle .navicon,
.greedy-nav__toggle .navicon::before,
.greedy-nav__toggle .navicon::after {
  background-color: #ffffff !important;
}
.greedy-nav .hidden-links,
.greedy-nav .hidden-links * {
  background-color: #050b14 !important;
  border-bottom: none !important;
}
.greedy-nav .hidden-links a:hover {
  color: #00bfa5 !important;
}

/* ───── 当前菜单项「常亮」高亮 ───── */
.current-highlight,
.greedy-nav a.current-highlight,
.site-nav a.current-highlight,
.main-navigation a.current-highlight,
.navbar a.current-highlight {
  color: #00bfa5 !important;
  border-bottom: 2px solid #00bfa5 !important;
}
</style>

<script>
(function() {
  // 通用路径规范化函数
  function normalizePath(path) {
    if (!path || path === '/') return '/';
    // 去掉末尾斜杠
    let p = path.replace(/\/$/, '');
    // 去掉 /index.html, /index.htm, /index
    p = p.replace(/\/index(\.html?)?$/i, '');
    // 如果去掉后变成了空字符串，则代表首页
    if (p === '') return '/';
    return p;
  }

  // 获取当前浏览器的真实相对路径（不含域名和参数）
  function getCurrentRelativePath() {
    let fullPath = window.location.pathname;
    // 如果站点部署在子目录（如 /myproject/），需要把子目录前缀去掉才能和导航链接 href 匹配
    let base = document.querySelector('base') ? document.querySelector('base').getAttribute('href') : '';
    if (base && base !== '/') {
      if (fullPath.startsWith(base)) {
        fullPath = fullPath.substring(base.length);
        if (fullPath === '') fullPath = '/';
      }
    }
    return fullPath;
  }

  // 给所有导航链接添加高亮
  function highlightCurrentNav() {
    var currentRaw = getCurrentRelativePath();
    var currentNorm = normalizePath(currentRaw);
    console.log('[高亮调试] 当前路径原始:', currentRaw, '→ 规范化:', currentNorm);

    // 尝试所有可能的导航容器选择器（适配常见主题）
    var navContainers = document.querySelectorAll('.greedy-nav, .site-nav, .main-navigation, .navbar, .nav, .navigation, .menu');
    if (navContainers.length === 0) {
      // 如果都没找到，就尝试查找页面中所有可能是导航链接的 a 标签（带有常见导航类）
      navContainers = [document];
    }

    var anyLinkFound = false;
    navContainers.forEach(function(container) {
      var links = container.querySelectorAll('a');
      links.forEach(function(link) {
        var href = link.getAttribute('href');
        if (!href || href === '#' || href.startsWith('javascript:')) return;

        // 将相对路径转为绝对路径，提取 pathname
        var linkUrl;
        try {
          linkUrl = new URL(href, window.location.origin);
        } catch(e) { return; }
        var linkPath = linkUrl.pathname;
        // 同样处理子目录前缀
        var base = document.querySelector('base') ? document.querySelector('base').getAttribute('href') : '';
        if (base && base !== '/' && linkPath.startsWith(base)) {
          linkPath = linkPath.substring(base.length);
          if (linkPath === '') linkPath = '/';
        }
        var linkNorm = normalizePath(linkPath);
        console.log('[高亮调试] 链接:', href, '→ 规范化:', linkNorm);

        var isMatch = (linkNorm === currentNorm);
        // 特殊处理首页
        if (!isMatch && currentNorm === '/' && linkNorm === '/') isMatch = true;
        if (!isMatch && currentNorm === '/' && linkNorm === '') isMatch = true;
        if (!isMatch && currentNorm === '' && linkNorm === '/') isMatch = true;

        if (isMatch) {
          console.log('[高亮调试] ✅ 匹配到当前页面，添加高亮样式 →', href);
          link.classList.add('current-highlight');
          anyLinkFound = true;
        } else {
          // 确保之前可能错误高亮的被清除
          link.classList.remove('current-highlight');
        }
      });
    });

    if (!anyLinkFound) {
      console.warn('[高亮调试] ⚠️ 没有找到任何匹配的导航链接，请检查选择器或页面结构');
    }
  }

  // 页面初次加载完成后执行
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', highlightCurrentNav);
  } else {
    highlightCurrentNav();
  }

  // 针对部分主题使用 Turbolinks 或 PJAX 无刷新跳转的情况
  if (typeof Turbolinks !== 'undefined' && Turbolinks.supported) {
    document.addEventListener('turbolinks:load', highlightCurrentNav);
  }
  // 针对普通浏览器的 history.pushState 单页应用（简单监听 popstate）
  window.addEventListener('popstate', highlightCurrentNav);
  // 额外保险：延迟 0.1 秒再执行一次，确保动态加载的导航完成
  setTimeout(highlightCurrentNav, 100);
})();
</script>
