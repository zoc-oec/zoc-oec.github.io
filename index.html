<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOC Ocular Epidemiology Consortium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 导航栏 */
        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(6px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 64px;
            flex-wrap: wrap;
        }
        .logo a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-left: 5%;
        }
        .logo img {
            height: 40px;
            width: auto;
        }
        .logo-text {
            display: flex;
            flex-direction: column;
        }
        .logo-main {
            color: #00bfa5;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .logo-sub {
            color: #f0f0f0;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin-right: 5%;
        }
        .nav-links li a {
            color: #f0f0f0;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }
        .nav-links li a:hover {
            color: #00bfa5;
            border-bottom-color: #00bfa5;
        }
        .nav-links li a.current-page {
            color: #00bfa5 !important;
            border-bottom: 2px solid #00bfa5 !important;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                padding: 12px 5%;
            }
            .logo a {
                margin-left: 0;
            }
            .nav-links {
                margin-right: 0;
            }
            .logo-sub {
                white-space: normal;
                font-size: 0.65rem;
                text-align: center;
            }
            .logo a {
                flex-direction: column;
                text-align: center;
                gap: 6px;
            }
            .logo-text {
                align-items: center;
            }
        }
body{
    background:#f4f7fb;
    color:#0a192f;
    font-family:Inter,sans-serif;
}

/* HERO */

.hero-new{
    position:relative;
    height:92vh;
    min-height:700px;

    background:
    linear-gradient(
    rgba(3,10,25,0.72),
    rgba(3,10,25,0.78)
    ),
    url('/images/Cover.png');

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
}

.hero-content{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:0 7%;
}

.hero-left{
    max-width:720px;
}

.hero-tag{
    color:#00c2ff;
    font-size:0.95rem;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.hero-left h1{
    font-size:6rem;
    color:white;
    font-weight:800;
    line-height:1;
    margin-bottom:10px;
}

.hero-left h2{
    font-size:2.2rem;
    color:white;
    font-weight:300;
    margin-bottom:30px;
}

.hero-slogan{
    font-size:1.4rem;
    line-height:1.7;
    color:#dce7f5;
    max-width:680px;
    margin-bottom:40px;
}

.hero-btns{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.hero-btn-primary,
.hero-btn-secondary{
    padding:16px 34px;
    border-radius:50px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.hero-btn-primary{
    background:linear-gradient(
    135deg,
    #00bfa5,
    #0088ff
    );
    color:white;
}

.hero-btn-primary:hover{
    transform:translateY(-2px);
}

.hero-btn-secondary{
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    backdrop-filter:blur(8px);
}

.hero-btn-secondary:hover{
    background:rgba(255,255,255,0.08);
}

/* SECTION */

section{
    padding:100px 7%;
}

.section-title{
    text-align:center;
    font-size:2.7rem;
    font-weight:800;
    margin-bottom:60px;
    color:#081b33;
}

/* ABOUT */

.about-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:28px;
}

.about-card{
    background:white;
    padding:40px 32px;
    border-radius:28px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
    transition:0.3s;
}

.about-card:hover{
    transform:translateY(-8px);
}

.about-icon{
    font-size:2.5rem;
    margin-bottom:20px;
}

.about-card h3{
    font-size:1.4rem;
    margin-bottom:16px;
}

.about-card p{
    color:#5c6b80;
    line-height:1.7;
}

/* IMPACT */

.impact-section{
    padding-top:20px;
}

.impact-grid{
    background:#071426;
    border-radius:32px;
    padding:50px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:30px;
    text-align:center;
}

.impact-item h2{
    color:#00c2ff;
    font-size:3rem;
    margin-bottom:12px;
}

.impact-item p{
    color:#d9e6f2;
    font-size:1.1rem;
}

/* RESEARCH */

.research-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.research-card{
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
    transition:0.3s;
}

.research-card:hover{
    transform:translateY(-8px);
}

.research-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.research-content{
    padding:28px;
}

.research-content h3{
    margin-bottom:14px;
    font-size:1.4rem;
}

.research-content p{
    line-height:1.7;
    color:#5c6b80;
}

/* CTA */

.cta-box{
    background:
    linear-gradient(
    135deg,
    #071426,
    #0c2340
    );

    border-radius:32px;

    padding:60px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;
}

.cta-box h2{
    color:white;
    font-size:2.2rem;
    margin-bottom:16px;
}

.cta-box p{
    color:#d7e6f5;
    font-size:1.1rem;
}

/* MOBILE */

@media(max-width:768px){

    .hero-left h1{
        font-size:4rem;
    }

    .hero-left h2{
        font-size:1.5rem;
    }

    .hero-slogan{
        font-size:1.1rem;
    }

    .section-title{
        font-size:2rem;
    }

    .cta-box{
        padding:40px 30px;
    }

}
        
<!-- HERO SECTION -->
<section class="hero-new">

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <div class="hero-left">

            <div class="hero-tag">
                Zhongshan Ophthalmic Center
            </div>

            <h1>
                ZOC-OEC
            </h1>

            <h2>
                Ocular Epidemiology Consortium
            </h2>

            <p class="hero-slogan">
                Advancing Precision Ophthalmology Through

            </p>

            <div class="hero-btns">
                <a href="#research" class="hero-btn-primary">
                    Explore Research
                </a>

                <a href="/publications.html" class="hero-btn-secondary">
                    Publications
                </a>
            </div>

        </div>

    </div>

</section>

<!-- ABOUT -->
<section class="about-section">

    <div class="section-title">
        About ZOC-OEC
    </div>

    <div class="about-grid">

        <div class="about-card">
            <div class="about-icon">📊</div>
            <h3>Longitudinal Cohorts</h3>
            <p>
                20+ years of population-based ocular epidemiology studies.
            </p>
        </div>

        <div class="about-card">
            <div class="about-icon">🧠</div>
            <h3>AI & Risk Prediction</h3>
            <p>
                Dynamic modeling and multimodal AI for disease progression.
            </p>
        </div>

        <div class="about-card">
            <div class="about-icon">🌍</div>
            <h3>Global Collaboration</h3>
            <p>
                International collaborative network in vision science.
            </p>
        </div>

        <div class="about-card">
            <div class="about-icon">🔬</div>
            <h3>Translational Impact</h3>
            <p>
                Bridging epidemiology, imaging and clinical ophthalmology.
            </p>
        </div>

    </div>

</section>

<!-- IMPACT -->
<section class="impact-section">

    <div class="impact-grid">

        <div class="impact-item">
            <h2>80,000+</h2>
            <p>Participants</p>
        </div>

        <div class="impact-item">
            <h2>20+</h2>
            <p>Years Follow-up</p>
        </div>

        <div class="impact-item">
            <h2>10M+</h2>

        </div>

        <div class="impact-item">
            <h2>8</h2>
            <p>Population Cohorts</p>
        </div>

    </div>

</section>

<!-- RESEARCH -->
<section class="research-section" id="research">

    <div class="section-title">

    </div>

    <div class="research-grid">

        <div class="research-card">
            <img src="/images/pacg.jpg">
            <div class="research-content">

                </p>

        <div class="research-card">

        <div class="research-card">
            <img src="/images/ai.jpg">

        </div>

        <div class="research-card">

        </div>

    </div>

</section>

<!-- CTA -->
<section class="cta-section">

    <div class="cta-box">

        <div>
            <h2>
                Together, We Advance Vision Science
            </h2>

            <p>
                Data-driven discovery through global collaboration.
            </p>
        </div>

        <a href="/data_access.html" class="hero-btn-primary">
            Collaboration Inquiry
        </a>

    </div>

</section>

<script>
    (function() {
        let currentPath = window.location.pathname;
        if (currentPath === '' || currentPath === '/' || currentPath === '/index.html') {
            currentPath = '/';
        } else {
            if (currentPath.endsWith('/')) {
                currentPath = currentPath.slice(0, -1);
            }
        }
        const navLinks = document.querySelectorAll('.nav-links a');
        navLinks.forEach(link => {
            let href = link.getAttribute('href');
            if (!href || href === '#' || href.startsWith('javascript:')) return;
            let linkPath = href;
            if (!linkPath.startsWith('/')) linkPath = '/' + linkPath;
            if (linkPath.endsWith('/') && linkPath !== '/') linkPath = linkPath.slice(0, -1);
            let isMatch = (currentPath === linkPath);
            if (currentPath === '/' && linkPath === '/') isMatch = true;
            if (isMatch) link.classList.add('current-page');
        });
    })();
</script>
</body>
</html>
